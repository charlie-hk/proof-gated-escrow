[package]
name = "proof-gated-escrow"
version = "0.1.0"
edition = "2021"
description = "Deterministic job-specification and result verifier for the the marketplace escrow marketplace."
license = "MIT"

[lib]
name = "proof_gated_escrow"
path = "src/lib.rs"

[[bin]]
name = "verifier-cli"
path = "src/bin/verifier_cli.rs"

[dependencies]
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
sha2 = "0.10.8"
hex = "0.4.3"
thiserror = "1.0.64"

[dev-dependencies]
# kept dependency-light on purpose; tests use the standard harness
